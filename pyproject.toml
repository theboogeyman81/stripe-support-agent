[project]
name = "stripe-support-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "voyageai",
    "qdrant-client",
    "httpx",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv",
    "tiktoken",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic-ai",
    "psycopg[binary]",
    "langfuse",
    "ragas>=0.2,<0.3",
    "langchain-google-vertexai>=3.2.4",
    "langchain-community>=0.2,<0.4",
    "redis[hiredis]>=5.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/eval"
markers = ["eval: threshold checks against eval result files"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
